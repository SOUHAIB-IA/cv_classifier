# The technical vocabulary the match score is computed over.
#
# Separate from canada_rules.yaml on purpose: that file holds Canadian resume
# rules with a source behind each one, and a glossary of tooling is not a
# Canadian rule. Edit this freely — it is the one file in the module you will
# want to grow as you read more postings.
#
# Why a vocabulary at all: scoring against every repeated word in an ad produced
# a number built on "looking", "build and maintain" and "across warehouse". A
# score that counts those is not a keyword score, it is a word-frequency score.

# Never a keyword on its own, in either language. These are the verbs and nouns
# every job ad and every resume contains.
generic:
  - ability, able, achieve, across, add, additional, advantage, analytics, apply
  - approach, area, asset, assist, background, benefit, best, build, building
  - business, candidate, career, challenge, chance, change, close, collaborate
  - colleague, company, complex, contribute, create, critical, culture, customer
  - day, deliver, delivery, demonstrate, design, detail, develop, development
  - drive, ensure, environment, equivalent, excellent, experience, expert
  - familiar, field, focus, follow, future, good, grow, growth, help, high
  - impact, implement, improve, include, industry, join, key, knowledge, large
  - lead, learn, level, like, looking, maintain, make, manage, member, mission
  - need, new, offer, operate, opportunity, own, part, partner, people, plus
  - position, practice, prefer, preferred, process, product, professional
  - proficiency, project, provide, quality, question, real, record, related
  - relevant, require, required, responsibility, role, scale, senior, service
  - share, skill, solution, stakeholder, standard, start, strong, success
  - support, system, take, task, team, technical, technology, time, tool, track
  - understand, user, value, work, world, year
  # the same, in French
  - aptitude, atout, avantage, besoin, candidat, capacite, carriere, collegue
  - competence, comprendre, concevoir, connaissance, contribuer, creer, defi
  - developpement, domaine, donnee, entreprise, environnement, equipe, equivalent
  - evoluer, experience, fonction, formation, gerer, haut, idealement, impact
  - livrer, maitrise, metier, mission, niveau, nouveau, outil, participer
  - partenaire, personne, poste, pratique, processus, produit, profil, projet
  - qualite, realiser, requis, responsabilite, resultat, role, savoir, secteur
  - service, solution, souhaite, soutien, systeme, technique, technologie
  - travail, travailler, utilisateur, valeur

# Terms that count, including ones this collection does not have — a gap is only
# reportable if the vocabulary knows the word.
